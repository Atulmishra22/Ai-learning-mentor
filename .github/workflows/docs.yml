name: Deploy MkDocs Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "RESEARCH.md"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-docs:
    name: Build & Deploy MkDocs Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for mkdocs git-revision-date plugin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs and Material theme
        run: pip install mkdocs mkdocs-material

      - name: Copy root markdown files into docs/
        run: cp RESEARCH.md docs/RESEARCH.md

      - name: Build and deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean
